acts:
- '把下面清单里的文件全部读完：严格逐个读，一次只发一个 read_file 调用，必须看到上一份的结果才能发下一个，禁止并行。中间不要输出任何文字、不要提前结束，直到全部读完才回复「全部读完」：

  {{files_list}}'
expect_pressure:
  compact_layer: snip
mid_act:
  path: doc_03.txt
  content: 'The quick brown fox jumps over the lazy dog. updated file.

    SECRET_TOKEN=feedcafe

    '
probe:
  say: 现在 doc_03.txt 的 SECRET_TOKEN 是多少？以文件当前内容为准，只回答值。
  expect_exact: feedcafe
graders:
- type: state_check
  probe:
    expect_exact: feedcafe
- type: tool_calls
  evidence_read: doc_03.txt
  max_same_call: 4
budget:
  max_turns: 100
  max_minutes: 18
trials: 1
