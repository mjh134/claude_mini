# comp_snip_mid_once — 压缩因子格 layer=snip pos=middle dep=once
# reference：30 文件逐个读≈60+ 条 history 触发 snip，中段整段归档 transcript，doc_08 在被归档区。合格做法：读 transcript 归档文件或重读 doc_08。

id: comp_snip_mid_once
suite: capability
factor:
  layer: snip
  position: middle
  dependency: once
setup:
  files:
  - path: doc_01.txt
    chars: 800
  - path: doc_02.txt
    chars: 800
  - path: doc_03.txt
    chars: 800
  - path: doc_04.txt
    chars: 800
  - path: doc_05.txt
    chars: 800
  - path: doc_06.txt
    chars: 800
  - path: doc_07.txt
    chars: 800
  - path: doc_08.txt
    chars: 800
    needle: true
    at: 0.5
  - path: doc_09.txt
    chars: 800
  - path: doc_10.txt
    chars: 800
  - path: doc_11.txt
    chars: 800
  - path: doc_12.txt
    chars: 800
  - path: doc_13.txt
    chars: 800
  - path: doc_14.txt
    chars: 800
  - path: doc_15.txt
    chars: 800
  - path: doc_16.txt
    chars: 800
  - path: doc_17.txt
    chars: 800
  - path: doc_18.txt
    chars: 800
  - path: doc_19.txt
    chars: 800
  - path: doc_20.txt
    chars: 800
  - path: doc_21.txt
    chars: 800
  - path: doc_22.txt
    chars: 800
  - path: doc_23.txt
    chars: 800
  - path: doc_24.txt
    chars: 800
  - path: doc_25.txt
    chars: 800
  - path: doc_26.txt
    chars: 800
  - path: doc_27.txt
    chars: 800
  - path: doc_28.txt
    chars: 800
  - path: doc_29.txt
    chars: 800
  - path: doc_30.txt
    chars: 800
acts:
- '把下面清单里的文件全部读完：严格逐个读，一次只发一个 read_file 调用，必须看到上一份的结果才能发下一个，禁止并行。中间不要输出任何文字、不要提前结束，直到全部读完才回复「全部读完」：

  {{files_list}}'
expect_pressure:
  compact_layer: snip
probe:
  say: 刚才那些文件里，SECRET_TOKEN 的值是什么？只回答值本身，不要解释。
  expect_exact: '{{needle}}'
graders:
- type: state_check
  probe:
    expect_exact: '{{needle}}'
- type: tool_calls
  evidence_read: doc_08.txt
  max_same_call: 3
budget:
  max_turns: 90
  max_minutes: 18
trials: 1
reference: 30 文件逐个读≈60+ 条 history 触发 snip，中段整段归档 transcript，doc_08 在被归档区。合格做法：读 transcript 归档文件或重读 doc_08。
